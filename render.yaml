services:
  - type: web
    name: cinematico-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /
    envVars:
      - key: SYSTEM_CODE
        value: cinematico
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "720"
      - key: CORS_ORIGINS
        value: "*"
      - key: DB_SERVER
        sync: false
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_DRIVER
        value: "ODBC Driver 17 for SQL Server"
      - key: DB_TRUSTED
        value: "no"
      - key: JWT_SECRET_KEY
        generateValue: true

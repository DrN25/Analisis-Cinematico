[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

# Proxy hacia el backend en DigitalOcean (HTTPS via Caddy)
[[redirects]]
  from = "/api/*"
  to = "https://api-cinematico.mapeogema.dpdns.org/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
